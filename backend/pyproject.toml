[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tuxnews-api"
version = "0.1.0"
description = "Secure, agent-first intelligent news service"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "arq>=0.26,<1",
  "asyncpg>=0.29,<1",
  "beautifulsoup4>=4.9,<5",
  "fastapi>=0.115,<1",
  "fastmcp==3.2.4",
  "feedparser>=6.0,<7",
  "email-validator>=2.2,<3",
  "httpx>=0.27,<1",
  "markdownify>=0.13,<2",
  "nh3>=0.2.18,<1",
  "orjson>=3.10,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.9,<1",
  "python-slugify>=8.0,<9",
  "PyJWT>=2.9,<3",
  "PyYAML>=6,<7",
  "qdrant-client>=1.12,<2",
  "redis>=5,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "trafilatura>=1.12,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
ai = ["litellm>=1.52,<2"]
embeddings = ["sentence-transformers>=3,<4"]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
tuxnews-mcp = "app.mcp.server:run_stdio"

[tool.hatch.build.targets.wheel]
packages = ["app"]
