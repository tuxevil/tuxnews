name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy app
      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Typecheck and build
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet

  tenant-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start integration services
        run: docker compose up -d --wait postgres redis qdrant
      - name: Create isolated test database
        run: docker compose exec -T postgres createdb -U tuxnews tuxnews_test
      - name: Run isolation matrix in the service network
        run: >-
          docker compose run --build --rm --no-deps
          -v "${{ github.workspace }}/backend/tests:/app/tests:ro"
          -e TUXNEWS_ALLOW_PUBLIC_REGISTRATION=true
          -e TUXNEWS_ALLOW_TEST_DATABASE_RESET=true
          -e TUXNEWS_TEST_DATABASE_URL=postgresql+asyncpg://tuxnews:tuxnews@postgres:5432/tuxnews_test
          -e TUXNEWS_DATABASE_URL=postgresql+asyncpg://tuxnews:tuxnews@postgres:5432/tuxnews_test
          -e TUXNEWS_REDIS_URL=redis://redis:6379/0
          -e TUXNEWS_QDRANT_URL=http://qdrant:6333
          api sh -c "pip install --no-cache-dir '.[dev]' && alembic upgrade head && pytest -q tests/test_tenant_isolation_matrix.py"

  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Start integration services
        run: docker compose up -d --wait postgres qdrant redis
      - name: Create isolated test database
        run: docker compose exec -T postgres createdb -U tuxnews tuxnews_test
      - name: Run backup/restore roundtrip
        run: pytest -q backend/tests/test_backup_restore.py -k roundtrip -s

  dependency-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e '.[dev]'
      - name: Audit Python dependencies
        run: pip-audit --severity=critical
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit frontend dependencies
        run: npm ci && npm audit --audit-level=critical
        working-directory: frontend

  load-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install load test client
        run: python -m pip install httpx
      - name: Start services with high quota for load measurement
        env:
          TUXNEWS_QUOTA_REQUESTS_PER_WINDOW: "100000"
          TUXNEWS_QUOTA_SCOPE_REQUESTS_PER_WINDOW: "100000"
          TUXNEWS_QUOTA_OPERATION_REQUESTS_PER_WINDOW: "100000"
          TUXNEWS_QUOTA_PROVIDER_REQUESTS_PER_WINDOW: "100000"
        run: docker compose up -d --wait api redis postgres qdrant
      - name: Run load gates (feed p95 budget 200 ms)
        run: |
          TOKEN=$(python -c 'import httpx; print(httpx.post("http://127.0.0.1:8000/api/v1/auth/login", json={"email": "admin@example.com", "password": "change-me-now"}).json()["access_token"])')
          TUXNEWS_LOAD_TOKEN="$TOKEN" python scripts/load_test.py \
            --base-url http://127.0.0.1:8000 \
            --users 6 --duration 8 --assert-feed-p95-ms 200
