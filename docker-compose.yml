services:
  api:
    build:
      context: ./backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      TUXNEWS_ENVIRONMENT: ${TUXNEWS_ENVIRONMENT:-local}
      TUXNEWS_ALLOW_PUBLIC_REGISTRATION: ${TUXNEWS_ALLOW_PUBLIC_REGISTRATION:-false}
      TUXNEWS_DATABASE_URL: ${TUXNEWS_DATABASE_URL:-postgresql+asyncpg://tuxnews:tuxnews@postgres:5432/tuxnews}
      TUXNEWS_REDIS_URL: ${TUXNEWS_REDIS_URL:-redis://redis:6379/0}
      TUXNEWS_QDRANT_URL: ${TUXNEWS_QDRANT_URL:-http://qdrant:6333}
      TUXNEWS_ARCHIVE_ROOT: /news-archive
      TUXNEWS_INGESTION_POLL_INTERVAL_SECONDS: ${TUXNEWS_INGESTION_POLL_INTERVAL_SECONDS:-900}
      TUXNEWS_EMBEDDING_MODEL: ${TUXNEWS_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      TUXNEWS_EMBEDDING_VERSION: ${TUXNEWS_EMBEDDING_VERSION:-v1}
      TUXNEWS_EMBEDDING_DIMENSION: ${TUXNEWS_EMBEDDING_DIMENSION:-384}
      TUXNEWS_OBSERVABILITY_HASH_SALT: ${TUXNEWS_OBSERVABILITY_HASH_SALT:-local-only-change-me-observability-salt}
      TUXNEWS_HEALTH_CHECK_TIMEOUT_SECONDS: ${TUXNEWS_HEALTH_CHECK_TIMEOUT_SECONDS:-2}
      TUXNEWS_QUOTA_POLICY_VERSION: ${TUXNEWS_QUOTA_POLICY_VERSION:-quota-v1}
      TUXNEWS_QUOTA_REQUESTS_PER_WINDOW: ${TUXNEWS_QUOTA_REQUESTS_PER_WINDOW:-120}
      TUXNEWS_QUOTA_SCOPE_REQUESTS_PER_WINDOW: ${TUXNEWS_QUOTA_SCOPE_REQUESTS_PER_WINDOW:-60}
      TUXNEWS_QUOTA_OPERATION_REQUESTS_PER_WINDOW: ${TUXNEWS_QUOTA_OPERATION_REQUESTS_PER_WINDOW:-60}
      TUXNEWS_QUOTA_PROVIDER_REQUESTS_PER_WINDOW: ${TUXNEWS_QUOTA_PROVIDER_REQUESTS_PER_WINDOW:-60}
      TUXNEWS_QUOTA_WINDOW_SECONDS: ${TUXNEWS_QUOTA_WINDOW_SECONDS:-60}
      TUXNEWS_QUOTA_DAILY_COST_USD: ${TUXNEWS_QUOTA_DAILY_COST_USD:-10}
      TUXNEWS_QUOTA_RESERVATION_TTL_SECONDS: ${TUXNEWS_QUOTA_RESERVATION_TTL_SECONDS:-300}
      TUXNEWS_QUOTA_FAIL_OPEN: ${TUXNEWS_QUOTA_FAIL_OPEN:-true}
      TUXNEWS_LLM_INPUT_COST_PER_MILLION_USD: ${TUXNEWS_LLM_INPUT_COST_PER_MILLION_USD:-0}
      TUXNEWS_LLM_OUTPUT_COST_PER_MILLION_USD: ${TUXNEWS_LLM_OUTPUT_COST_PER_MILLION_USD:-0}
      TUXNEWS_LLM_COST_CURRENCY: ${TUXNEWS_LLM_COST_CURRENCY:-USD}
      TUXNEWS_LLM_USAGE_RETENTION_DAYS: ${TUXNEWS_LLM_USAGE_RETENTION_DAYS:-90}
      TUXNEWS_AUDIT_RETENTION_DAYS: ${TUXNEWS_AUDIT_RETENTION_DAYS:-180}
      TUXNEWS_ACCESS_TOKEN_SECRET: ${TUXNEWS_ACCESS_TOKEN_SECRET:-local-only-change-me-access-please-change}
      TUXNEWS_REFRESH_TOKEN_SECRET: ${TUXNEWS_REFRESH_TOKEN_SECRET:-local-only-change-me-refresh-please-change}
      TUXNEWS_ACCESS_TOKEN_KEY_ID: ${TUXNEWS_ACCESS_TOKEN_KEY_ID:-access-v1}
      TUXNEWS_REFRESH_TOKEN_KEY_ID: ${TUXNEWS_REFRESH_TOKEN_KEY_ID:-refresh-v1}
      TUXNEWS_ACCESS_TOKEN_PREVIOUS_SECRET: ${TUXNEWS_ACCESS_TOKEN_PREVIOUS_SECRET:-}
      TUXNEWS_REFRESH_TOKEN_PREVIOUS_SECRET: ${TUXNEWS_REFRESH_TOKEN_PREVIOUS_SECRET:-}
      TUXNEWS_ACCESS_TOKEN_PREVIOUS_KEY_ID: ${TUXNEWS_ACCESS_TOKEN_PREVIOUS_KEY_ID:-}
      TUXNEWS_REFRESH_TOKEN_PREVIOUS_KEY_ID: ${TUXNEWS_REFRESH_TOKEN_PREVIOUS_KEY_ID:-}
      TUXNEWS_ACCESS_TOKEN_PREVIOUS_VALID_UNTIL: ${TUXNEWS_ACCESS_TOKEN_PREVIOUS_VALID_UNTIL:-}
      TUXNEWS_REFRESH_TOKEN_PREVIOUS_VALID_UNTIL: ${TUXNEWS_REFRESH_TOKEN_PREVIOUS_VALID_UNTIL:-}
    volumes:
      - archive_data:/news-archive
      - embedding_cache:/root/.cache
    ports:
      - "${TUXNEWS_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks: [private]

  worker:
    build:
      context: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      TUXNEWS_ENVIRONMENT: ${TUXNEWS_ENVIRONMENT:-local}
      TUXNEWS_ALLOW_PUBLIC_REGISTRATION: ${TUXNEWS_ALLOW_PUBLIC_REGISTRATION:-false}
      TUXNEWS_DATABASE_URL: ${TUXNEWS_DATABASE_URL:-postgresql+asyncpg://tuxnews:tuxnews@postgres:5432/tuxnews}
      TUXNEWS_REDIS_URL: ${TUXNEWS_REDIS_URL:-redis://redis:6379/0}
      TUXNEWS_QDRANT_URL: ${TUXNEWS_QDRANT_URL:-http://qdrant:6333}
      TUXNEWS_ARCHIVE_ROOT: /news-archive
      TUXNEWS_INGESTION_POLL_INTERVAL_SECONDS: ${TUXNEWS_INGESTION_POLL_INTERVAL_SECONDS:-900}
      TUXNEWS_EMBEDDING_MODEL: ${TUXNEWS_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      TUXNEWS_EMBEDDING_VERSION: ${TUXNEWS_EMBEDDING_VERSION:-v1}
      TUXNEWS_EMBEDDING_DIMENSION: ${TUXNEWS_EMBEDDING_DIMENSION:-384}
      TUXNEWS_OBSERVABILITY_HASH_SALT: ${TUXNEWS_OBSERVABILITY_HASH_SALT:-local-only-change-me-observability-salt}
      TUXNEWS_HEALTH_CHECK_TIMEOUT_SECONDS: ${TUXNEWS_HEALTH_CHECK_TIMEOUT_SECONDS:-2}
      TUXNEWS_QUOTA_POLICY_VERSION: ${TUXNEWS_QUOTA_POLICY_VERSION:-quota-v1}
      TUXNEWS_QUOTA_REQUESTS_PER_WINDOW: ${TUXNEWS_QUOTA_REQUESTS_PER_WINDOW:-120}
      TUXNEWS_QUOTA_SCOPE_REQUESTS_PER_WINDOW: ${TUXNEWS_QUOTA_SCOPE_REQUESTS_PER_WINDOW:-60}
      TUXNEWS_QUOTA_OPERATION_REQUESTS_PER_WINDOW: ${TUXNEWS_QUOTA_OPERATION_REQUESTS_PER_WINDOW:-60}
      TUXNEWS_QUOTA_PROVIDER_REQUESTS_PER_WINDOW: ${TUXNEWS_QUOTA_PROVIDER_REQUESTS_PER_WINDOW:-60}
      TUXNEWS_QUOTA_WINDOW_SECONDS: ${TUXNEWS_QUOTA_WINDOW_SECONDS:-60}
      TUXNEWS_QUOTA_DAILY_COST_USD: ${TUXNEWS_QUOTA_DAILY_COST_USD:-10}
      TUXNEWS_QUOTA_RESERVATION_TTL_SECONDS: ${TUXNEWS_QUOTA_RESERVATION_TTL_SECONDS:-300}
      TUXNEWS_QUOTA_FAIL_OPEN: ${TUXNEWS_QUOTA_FAIL_OPEN:-true}
      TUXNEWS_LLM_INPUT_COST_PER_MILLION_USD: ${TUXNEWS_LLM_INPUT_COST_PER_MILLION_USD:-0}
      TUXNEWS_LLM_OUTPUT_COST_PER_MILLION_USD: ${TUXNEWS_LLM_OUTPUT_COST_PER_MILLION_USD:-0}
      TUXNEWS_LLM_COST_CURRENCY: ${TUXNEWS_LLM_COST_CURRENCY:-USD}
      TUXNEWS_LLM_USAGE_RETENTION_DAYS: ${TUXNEWS_LLM_USAGE_RETENTION_DAYS:-90}
      TUXNEWS_AUDIT_RETENTION_DAYS: ${TUXNEWS_AUDIT_RETENTION_DAYS:-180}
      TUXNEWS_ACCESS_TOKEN_SECRET: ${TUXNEWS_ACCESS_TOKEN_SECRET:-local-only-change-me-access-please-change}
      TUXNEWS_REFRESH_TOKEN_SECRET: ${TUXNEWS_REFRESH_TOKEN_SECRET:-local-only-change-me-refresh-please-change}
      TUXNEWS_ACCESS_TOKEN_KEY_ID: ${TUXNEWS_ACCESS_TOKEN_KEY_ID:-access-v1}
      TUXNEWS_REFRESH_TOKEN_KEY_ID: ${TUXNEWS_REFRESH_TOKEN_KEY_ID:-refresh-v1}
      TUXNEWS_ACCESS_TOKEN_PREVIOUS_SECRET: ${TUXNEWS_ACCESS_TOKEN_PREVIOUS_SECRET:-}
      TUXNEWS_REFRESH_TOKEN_PREVIOUS_SECRET: ${TUXNEWS_REFRESH_TOKEN_PREVIOUS_SECRET:-}
      TUXNEWS_ACCESS_TOKEN_PREVIOUS_KEY_ID: ${TUXNEWS_ACCESS_TOKEN_PREVIOUS_KEY_ID:-}
      TUXNEWS_REFRESH_TOKEN_PREVIOUS_KEY_ID: ${TUXNEWS_REFRESH_TOKEN_PREVIOUS_KEY_ID:-}
      TUXNEWS_ACCESS_TOKEN_PREVIOUS_VALID_UNTIL: ${TUXNEWS_ACCESS_TOKEN_PREVIOUS_VALID_UNTIL:-}
      TUXNEWS_REFRESH_TOKEN_PREVIOUS_VALID_UNTIL: ${TUXNEWS_REFRESH_TOKEN_PREVIOUS_VALID_UNTIL:-}
    volumes:
      - archive_data:/news-archive
      - embedding_cache:/root/.cache
      - ./scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks: [private]

  frontend:
    build:
      context: ./frontend
    ports:
      - "${TUXNEWS_FRONTEND_PORT:-3000}:80"
    depends_on: [api]
    networks: [private]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tuxnews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tuxnews}
      POSTGRES_DB: ${POSTGRES_DB:-tuxnews}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [private]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [private]

  qdrant:
    image: qdrant/qdrant:v1.12.5
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "grep -q entrypoint /proc/1/cmdline"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [private]

  ollama:
    image: ollama/ollama:latest
    profiles: [local]
    volumes:
      - ollama_data:/root/.ollama
    networks: [private]

  backup:
    image: postgres:16-alpine
    profiles: [backup]
    entrypoint: ["sh", "-c", "trap : TERM INT; sleep infinity & wait"]
    volumes:
      - ./scripts:/scripts:ro
      - backup_data:/backups
      - archive_data:/news-archive:ro
    environment:
      TUXNEWS_POSTGRES_URL: ${TUXNEWS_BACKUP_POSTGRES_URL:-postgresql://tuxnews:tuxnews@postgres:5432/tuxnews}
      TUXNEWS_BACKUP_DIR: /backups
      TUXNEWS_BACKUP_RETENTION_DAYS: ${TUXNEWS_BACKUP_RETENTION_DAYS:-14}
      TUXNEWS_ARCHIVE_ROOT: /news-archive
      TUXNEWS_QDRANT_URL: ${TUXNEWS_QDRANT_URL:-http://qdrant:6333}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks: [private]

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  archive_data:
  ollama_data:
  backup_data:
  embedding_cache:

networks:
  private:
    driver: bridge
